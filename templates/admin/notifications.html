<!-- Admin Notifications Panel -->

            <div class="modal-body p-0">

                <ul class="nav nav-tabs" id="notificationTabs" role="tablist" style="border-bottom: 2px solid #dee2e6;">

                    <div class="tab-pane fade show active" id="contacts-panel" role="tabpanel" aria-labelledby="contacts-tab">

                        </div>
                    </div>
                    
                    <!-- Consultation Requests Tab -->
                    <div class="tab-pane fade" id="consultations-panel" role="tabpanel" aria-labelledby="consultations-tab">

                        <div id="consultations-empty" class="p-4 text-center text-muted" style="display:none;">
